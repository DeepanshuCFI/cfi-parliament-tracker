* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --brand: #4736FE;
  --lav: #F3F1FF;
  --dark: #1a1c1c;
  --muted: #63607A;
}
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--lav);
  color: var(--dark);
  font-family: 'Montserrat', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 89px;
  position: relative;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { height: 52px; width: auto; display: block; }
.kicker {
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.22em;
  color: var(--brand);
  text-transform: uppercase;
}
.spacer { flex: 0.85; }
.spacer.below { flex: 1.15; }
.headline {
  font-weight: 700;
  font-size: 60px;
  line-height: 1.18;
  letter-spacing: -0.015em;
}
.headline .ask { color: var(--brand); }
.footer {
  position: absolute;
  left: 89px;
  right: 89px;
  bottom: 89px;
  font-family: 'Geist', sans-serif;
  font-weight: 500;
  font-size: 21px;
  color: var(--muted);
}
</style>
