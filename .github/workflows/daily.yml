name: Daily refresh

on:
  schedule:
    - cron: '15 2 * * *'   # 02:15 UTC = 07:45 IST, before the morning brief
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # exact pin: this runs unattended with secrets in scope - upgrades are deliberate
      - run: pip install "anthropic==0.116.0"

      - name: Pull current-session questions (delta)
        run: python3 pipeline/delta_refresh.py

      - name: Curate new titles (Claude, hard-capped ~INR 100/month)
        env:
          # step-scoped on purpose: no other step (esp. the npm deploy) can read it
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline/curate.py

      - name: Update enrichment (MP stats, never-asked, states)
        run: python3 pipeline/build_enrich.py

      - name: Publish dataset + CSV
        run: python3 pipeline/publish.py

      - name: Build page
        run: python3 pipeline/build_page.py

      - name: Sanity gate
        run: python3 pipeline/sanity_check.py

      - name: Alert on rollover / chronic source failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - > /tmp/alert.txt <<'PY'
          import json
          r = json.load(open('data/refresh_report.json'))
          msgs = []
          if r.get('rollover_alert'):
              msgs.append('SESSION ROLLOVER NEEDED: ' + str(r['rollover_alert']))
          for src, n in sorted((r.get('failing_streaks') or {}).items()):
              msgs.append(f'{src} has failed {n} consecutive runs')
          if msgs:  # no bare print: an empty print emits '\n' and [ -s ] treats that as an alert
              print('\n'.join(msgs))
          PY
          if [ -s /tmp/alert.txt ]; then
            TITLE="Tracker needs attention"
            NUM=$(gh issue list --state open \
              --search "\"$TITLE\" in:title author:app/github-actions" \
              --json number --jq '.[0].number' || true)
            {
              cat /tmp/alert.txt
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "Fix: edit data/sessions.json (rollover) or check the failing source, then close this issue."
            } > /tmp/alert_body.txt
            if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
              gh issue comment "$NUM" --body-file /tmp/alert_body.txt
            else
              gh issue create --title "$TITLE" --body-file /tmp/alert_body.txt
            fi
          else
            echo "No rollover or chronic-failure alerts."
            # self-heal: close the attention issue once alerts clear
            NUM=$(gh issue list --state open \
              --search "\"Tracker needs attention\" in:title author:app/github-actions" \
              --json number --jq '.[0].number' || true)
            if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
              gh issue close "$NUM" --comment "Alerts clear on today's run - closing automatically."
            fi
          fi

      - name: Commit data + site
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%FT%TZ > data/last_run.txt
          git add data/ site/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes today."
          else
            git commit -m "Daily refresh $(date -u +%F)"
            # survive a human push that landed mid-run instead of failing the day
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrub git credential before third-party deploy step
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: site
        env:
          # only VERCEL_* is visible here; the npm-fetched CLI never sees the
          # Anthropic key (step-scoped above) or the GitHub token (scrubbed above)
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # exact pin (locally tested version) - a compromised latest release must
        # not auto-run here; bump deliberately
        run: npx vercel@56.5.0 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily refresh FAILED"
          NUM=$(gh issue list --state open \
            --search "\"$TITLE\" in:title author:app/github-actions" \
            --json number --jq '.[0].number' || true)
          BODY="Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Refresh report"
            echo '```json'
            cat data/refresh_report.json 2>/dev/null || echo '{}'
            echo '```'
            echo "## Curation log (last run)"
            echo '```json'
            python3 -c "import json;d=json.load(open('data/curation_log.json'));print(json.dumps(d['runs'][-1] if d.get('runs') else {}, indent=2))" 2>/dev/null || echo '{}'
            echo '```'
            echo "## Enrichment"
            echo '```json'
            cat data/enrich_report.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
