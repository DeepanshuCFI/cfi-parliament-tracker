name: Check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secrets are configured (values never printed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          {
            echo "## Secret status"
            echo ""
            echo "| Secret | Status | Needed for |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          report () {   # $1=name  $2=purpose
            if [ -n "${!1}" ]; then
              echo "| \`$1\` | PRESENT | $2 |" >> "$GITHUB_STEP_SUMMARY"
              echo "$1: PRESENT"
            else
              echo "| \`$1\` | **MISSING** | $2 |" >> "$GITHUB_STEP_SUMMARY"
              echo "$1: MISSING"
              missing=$((missing+1))
            fi
          }

          report ANTHROPIC_API_KEY "Claude curation of new titles (optional - pipeline degrades to keyword-only)"
          report VERCEL_TOKEN      "Deploying the site"
          report VERCEL_ORG_ID     "Targeting the CFI Vercel team"
          report VERCEL_PROJECT_ID "Targeting the road-safety-parliament project"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -gt 0 ]; then
            echo "$missing secret(s) missing - add them at Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$missing secret(s) missing"
            exit 1
          fi
          echo "All four secrets are configured. The daily refresh is ready to run." >> "$GITHUB_STEP_SUMMARY"
